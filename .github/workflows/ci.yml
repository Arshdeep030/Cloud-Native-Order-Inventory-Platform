name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: order_user
          POSTGRES_PASSWORD: order_password
          POSTGRES_DB: order_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql+psycopg://order_user:order_password@localhost:5432/order_test_db
      REDIS_URL: redis://localhost:6379
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      JWT_SECRET: local-development-secret-change-this

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v

  docker-build:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: |
          docker build -t cloud-order-api:test .

      - name: Build Gateway image
        run: |
          docker build -t cloud-order-gateway:test ./gateway

      - name: Build Inventory image
        run: |
          docker build -t cloud-order-inventory:test ./services/inventory

      - name: Build Payment image
        run: |
          docker build -t cloud-order-payment:test ./services/payment

      - name: Build Order Worker image
        run: |
          docker build -t cloud-order-worker:test .

  startup-health:

    needs: docker-build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from template
        run: |
          cp .env.example .env

      - name: Start Docker Compose stack
        run: |
          docker compose up -d

      - name: Show running containers
        run: |
          docker compose ps

      - name: Wait for services to start
        run: |
          sleep 15

      - name: Check API liveness
        run: |
          curl --fail http://localhost:8001/health/live

      - name: Check API readiness
        run: |
          curl --fail http://localhost:8001/health/ready

      - name: Check Gateway liveness
        run: |
          curl --fail http://localhost:8000/health/live

      - name: Check Gateway readiness
        run: |
          curl --fail http://localhost:8000/health/ready

      - name: Show container status
        if: always()
        run: |
          docker compose ps

      - name: Show service logs
        if: failure()
        run: |
          docker compose logs --tail=100

      - name: Stop Docker Compose stack
        if: always()
        run: |
          docker compose down -v
